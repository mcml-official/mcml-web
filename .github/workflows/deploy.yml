name: deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: 24
          
      - name: Check runtime
        run: |
          node -v
          command -v node
          yarn node --version
          command -v pm2
        
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: pm2 reload web --update-env
